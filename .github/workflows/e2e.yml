name: E2E

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# 같은 브랜치에서 새 커밋이 푸시되면 진행 중인 실행을 취소한다.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # .env 는 커밋되지 않으므로 CI 에서 주입한다. 필요 시 repo Secret/Variable 로 오버라이드.
      NEXT_PUBLIC_BACKEND_API_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_API_URL || vars.NEXT_PUBLIC_BACKEND_API_URL || 'https://bootcamp-api.codeit.kr/api/18-3/the-julge' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
